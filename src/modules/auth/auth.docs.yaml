# Auth endpoints (web + CMS).
# Loaded by src/config/swagger.js; served at /api-docs.

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: object
          properties:
            _id:
              type: string
            name:
              type: string
              enum: [user, admin, superadmin]
            permissions:
              type: array
              items:
                type: string
        lastLoginAt:
          type: integer
          format: int64
          nullable: true
          description: Unix timestamp (seconds) of the last successful sign-in
        lastSeenAt:
          type: integer
          format: int64
          nullable: true
          description: >
            Unix timestamp (seconds) of the last authenticated request, refreshed
            at most once a minute; cleared on sign-out
        status:
          type: string
          enum: [online, offline]
          description: >
            Returned by the CMS user endpoints. `online` when seen in the last
            5 minutes.
        createdAt:
          type: integer
          format: int64
          description: Unix timestamp (seconds)
        updatedAt:
          type: integer
          format: int64
          description: Unix timestamp (seconds)
    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: >
            Store it on the client (e.g. a cookie set from JavaScript) and send
            it back on every request as `Authorization: Bearer <token>`.
        expiresAt:
          type: integer
          format: int64
          description: Unix timestamp (seconds) when the token expires; drop it then
    Error:
      type: object
      properties:
        error:
          type: string

/api/web/auth/signup:
  post:
    summary: Create a new user account
    tags: [Web Auth]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, email, password]
            properties:
              name:
                type: string
                example: Jeya
              email:
                type: string
                format: email
                example: jeya@test.com
              password:
                type: string
                format: password
                minLength: 8
                example: password123
    responses:
      201:
        description: User created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthResponse'
      400:
        description: Validation failed
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      409:
        description: Email already registered
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/web/auth/signin:
  post:
    summary: Sign in with email and password
    tags: [Web Auth]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email:
                type: string
                format: email
                example: jeya@test.com
              password:
                type: string
                format: password
                example: password123
    responses:
      200:
        description: Signed in. Store `token` and send it as a Bearer header.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthResponse'
      400:
        description: Validation failed
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      401:
        description: Invalid email or password
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/web/auth/profile:
  get:
    summary: Get the signed-in user's details
    tags: [Web Auth]
    description: "Reads the token from the `Authorization: Bearer` header."
    security: [{ bearerAuth: [] }]
    responses:
      200:
        description: The signed-in user
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  $ref: '#/components/schemas/User'
      401:
        $ref: '#/components/responses/Unauthorized'
      403:
        description: Token is valid but not a web session
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/web/auth/signout:
  post:
    summary: Sign out of the web session
    tags: [Web Auth]
    description: >
      Marks the account offline when a valid Bearer token is sent. Tokens are
      stateless, so the client must also delete its stored token. Always
      succeeds, even without a valid session, so clients can clean up an
      expired one.
    responses:
      200:
        description: Signed out
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Signed out

/api/cms/auth/signin:
  post:
    summary: Sign in to the CMS (admin accounts only)
    tags: [CMS Auth]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email:
                type: string
                format: email
              password:
                type: string
                format: password
    responses:
      200:
        description: Signed in. Store `token` and send it as a Bearer header.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthResponse'
      400:
        description: Validation failed
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      401:
        description: Invalid email or password
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      403:
        description: User exists but is not an admin
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/cms/auth/profile:
  get:
    summary: Get the signed-in CMS user's details
    tags: [CMS Auth]
    description: "Reads the token from the `Authorization: Bearer` header."
    security: [{ bearerAuth: [] }]
    responses:
      200:
        description: The signed-in user
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  $ref: '#/components/schemas/User'
      401:
        $ref: '#/components/responses/Unauthorized'
      403:
        $ref: '#/components/responses/WrongScope'

/api/cms/auth/signout:
  post:
    summary: Sign out of the CMS session
    tags: [CMS Auth]
    description: >
      Marks the account offline when a valid Bearer token is sent. Tokens are
      stateless, so the client must also delete its stored token. Always
      succeeds, even without a valid session, so clients can clean up an
      expired one.
    responses:
      200:
        description: Signed out
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Signed out
