# Style endpoints (CMS).
# Loaded by src/config/swagger.js; served at /api-docs.

components:
  schemas:
    Style:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        image:
          allOf:
            - $ref: '#/components/schemas/Media'
          nullable: true
          description: Populated media, including a fresh signed url
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64

/api/cms/style:
  get:
    summary: List styles
    tags: [CMS Style]
    security: [{ bearerAuth: [] }]
    parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
    responses:
      200:
        description: Page of styles
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Style'
                - $ref: '#/components/schemas/PageMeta'
      401:
        $ref: '#/components/responses/Unauthorized'
      403:
        $ref: '#/components/responses/WrongScope'
  post:
    summary: Create a style
    tags: [CMS Style]
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name:
                type: string
              image:
                type: string
                nullable: true
                description: Media id
    responses:
      201:
        description: Created
        content:
          application/json:
            schema:
              type: object
              properties:
                style:
                  $ref: '#/components/schemas/Style'
      400:
        $ref: '#/components/responses/ValidationFailed'
      401:
        $ref: '#/components/responses/Unauthorized'
      409:
        $ref: '#/components/responses/Conflict'
      422:
        $ref: '#/components/responses/RefNotFound'

/api/cms/style/{id}:
  get:
    summary: Get a style by id
    tags: [CMS Style]
    security: [{ bearerAuth: [] }]
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    responses:
      200:
        description: The style
        content:
          application/json:
            schema:
              type: object
              properties:
                style:
                  $ref: '#/components/schemas/Style'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFoundError'
  put:
    summary: Update a style
    tags: [CMS Style]
    security: [{ bearerAuth: [] }]
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
              image:
                type: string
                nullable: true
                description: Media id
    responses:
      200:
        description: Updated
        content:
          application/json:
            schema:
              type: object
              properties:
                style:
                  $ref: '#/components/schemas/Style'
      400:
        $ref: '#/components/responses/ValidationFailed'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFoundError'
      409:
        $ref: '#/components/responses/Conflict'
  delete:
    summary: Permanently delete a style
    description: >
      Hard delete. Removes the row outright, with no way back -- use the
      `PATCH /{id}/delete` soft delete unless the record must genuinely be
      purged. Works on already soft-deleted records too. Anything still
      referencing this id is left pointing at nothing.
    tags: [CMS Style]
    security: [{ bearerAuth: [] }]
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    responses:
      204:
        description: Permanently deleted
      400:
        $ref: '#/components/responses/ValidationFailed'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFoundError'

/api/cms/style/{id}/delete:
  patch:
    summary: Delete a style
    description: >
      Soft delete. Sets `deleted` to 1 and returns the updated record; the
      row is kept but stops appearing in any list or lookup. Deleting an
      already-deleted record returns 404, since it is no longer visible.
    tags: [CMS Style]
    security: [{ bearerAuth: [] }]
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    responses:
      200:
        description: Deleted
        content:
          application/json:
            schema:
              type: object
              properties:
                style:
                  $ref: '#/components/schemas/Style'
      400:
        $ref: '#/components/responses/ValidationFailed'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFoundError'

/api/cms/style/{id}/restore:
  patch:
    summary: Restore a style
    description: >
      Undoes a soft delete. Sets `deleted` back to 0 and returns the
      record, which shows up in ordinary lists and lookups again. Restoring
      a record that is not deleted leaves it as it is.
    tags: [CMS Style]
    security: [{ bearerAuth: [] }]
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    responses:
      200:
        description: Restored
        content:
          application/json:
            schema:
              type: object
              properties:
                style:
                  $ref: '#/components/schemas/Style'
      400:
        $ref: '#/components/responses/ValidationFailed'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFoundError'
